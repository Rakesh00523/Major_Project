name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}

permissions:
  contents: write
  packages: write
  id-token: write # required for Cosign keyless signing via GitHub OIDC
  security-events: write # required to upload Trivy SARIF results

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-gates:
    name: Validate CI & Security Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix control-api ci
          npm --prefix app ci

      - name: Run backend auth tests
        run: npm --prefix control-api test

      - name: Run frontend tests & lint
        run: |
          npm --prefix app run lint
          npm --prefix app run test

  build-scan-sign:
    name: Build, scan, sign & push
    needs: validate-gates
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1' # fail the build on CRITICAL/HIGH findings

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Test container health
        run: |
          docker run -d --name test-container -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          sleep 3
          curl -f http://localhost:8080/healthz || (docker logs test-container && exit 1)
          docker rm -f test-container

      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via Sigstore/Fulcio)
        run: |
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
        continue-on-error: true

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
        continue-on-error: true

  gitops-bump:
    name: Bump GitOps manifest (dev)
    needs: build-scan-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump dev overlay image tag
        env:
          IMAGE_TAG: ${{ needs.build-scan-sign.outputs.image-tag }}
          OVERLAY: dev
        run: node scripts/bump-image-tag.mjs

      - name: Commit and push manifest update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(gitops): bump dev image to ${{ needs.build-scan-sign.outputs.image-tag }} [skip ci]'
          file_pattern: 'k8s/overlays/dev/kustomization.yaml'

  failure-alert:
    name: Failure-Only Alert Notification
    if: failure()
    needs: [validate-gates, build-scan-sign]
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic failure summary
        run: |
          echo "=== CD PIPELINE FAILURE DETECTED ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Repository: ${{ github.repository }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Validation Gates: ${{ needs.validate-gates.result }}"
          echo "Build & Scan Result: ${{ needs.build-scan-sign.result }}"
          echo "======================================"

      - name: Send failure webhook notification (if configured)
        if: env.FAILURE_WEBHOOK_URL != ''
        env:
          FAILURE_WEBHOOK_URL: ${{ secrets.FAILURE_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"🚨 CD Pipeline Failed for ${{ github.repository }} on commit ${{ github.sha }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${FAILURE_WEBHOOK_URL}" || true
