# Helm values for prometheus-community/kube-prometheus-stack, tuned down for
# a laptop-sized Minikube cluster.
#
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace \
#     -f monitoring/kube-prometheus-stack-values.yaml

grafana:
  adminPassword: admin
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  # Plugin loading on a contended laptop CPU regularly takes 20-30s; the
  # chart's default probe timing kills the pod before it finishes starting,
  # producing a genuine restart loop (observed locally: 3 restarts under
  # concurrent ArgoCD + Prometheus image pulls). More tolerant timing fixes
  # it without touching resource requests.
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 6

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    # Pick up ServiceMonitors from any namespace, not just `monitoring` —
    # the app's ServiceMonitor lives alongside the app in pipeline-dev/prod.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
