apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pipeline-prod

resources:
  - ../../base

# NOTE: kustomize's `images:`/`replicas:` transformers don't recognize the
# custom `Rollout` kind (argoproj.io/v1alpha1), so both silently no-op on
# it. Patched directly instead.
patches:
  - target:
      kind: Rollout
      name: pipeline-dashboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/your-org/pipeline-dashboard:placeholder
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: Ingress
      name: pipeline-dashboard
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pipeline-dashboard.local
