apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pipeline-dev

resources:
  - ../../base

# NOTE: kustomize's `images:` transformer doesn't recognize the custom
# `Rollout` kind (argoproj.io/v1alpha1), so it silently leaves the image tag
# unchanged. We patch the image directly instead — this is also what
# scripts/bump-image-tag.mjs and scripts/promote.mjs edit.
patches:
  - target:
      kind: Rollout
      name: pipeline-dashboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: pipeline-dashboard:local
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  - target:
      kind: Ingress
      name: pipeline-dashboard
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: pipeline-dashboard.dev.local
