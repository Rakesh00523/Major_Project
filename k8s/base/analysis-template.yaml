# Gates the canary's promotion (and drives automatic rollback) on a live
# Prometheus query. This demo template checks the nginx-exporter sidecar's
# reachability (`nginx_up`) — an honest, always-available signal, since the
# stock nginx stub_status module (what nginx-prometheus-exporter reads)
# doesn't expose per-status-code request counts, so a true HTTP error-rate
# query isn't available from this exporter.
#
# For a real production success-rate gate, swap the query below for one of:
#   - ingress-nginx controller metrics, which DO carry a `status` label:
#     sum(rate(nginx_ingress_controller_requests{ingress="pipeline-dashboard",status=~"5.."}[2m]))
#     / sum(rate(nginx_ingress_controller_requests{ingress="pipeline-dashboard"}[2m]))
#     with successCondition: result[0] <= 0.05
#   - or an app-level RED metrics exporter (e.g. prom-client) if the app
#     itself starts serving dynamic requests instead of a static SPA.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: exporter-health
spec:
  metrics:
    - name: exporter-up
      interval: 15s
      count: 4
      successCondition: result[0] == 1
      failureLimit: 2
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
          # No join needed: the ServiceMonitor's relabeling already stamps
          # `namespace` and `service` onto nginx_up directly (confirmed via
          # `curl .../api/v1/query?query=nginx_up`). An earlier version of
          # this query joined against kube_pod_labels for extra safety, but
          # that metric doesn't exist in this cluster at all — modern
          # kube-state-metrics makes per-label metrics opt-in via
          # --metric-labels-allowlist, off by default — so the join always
          # returned empty and crashed the analysis ("reflect: slice index
          # out of range" from indexing an empty result). Simpler and it
          # actually works.
          query: |
            avg(nginx_up{namespace="{{args.namespace}}", service="pipeline-dashboard"})
  args:
    - name: namespace
