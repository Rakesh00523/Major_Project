apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-dashboard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: pipeline-dashboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipeline-dashboard
                port:
                  number: 80
