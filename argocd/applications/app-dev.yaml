apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipeline-dashboard-dev
  namespace: argocd
spec:
  project: default

  source:
    # Replace with your actual GitHub remote once the repo is pushed.
    repoURL: https://github.com/your-org/ai-cicd-pipeline.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: pipeline-dev

  syncPolicy:
    automated:
      prune: true # remove resources that are no longer defined in Git
      selfHeal: true # revert any manual/out-of-band cluster changes
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
