# Self-hosted SonarQube for local development.
#
# Usage:
#   docker compose -f sonarqube/docker-compose.yml up -d
#   open http://localhost:9000  (default login: admin / admin)
#
# This is the *persistent* instance with real quality-gate history across
# scans. CI uses a separate, ephemeral SonarQube container per run (see
# .github/workflows/ci.yml) since a GitHub-hosted runner cannot reach this
# machine's Docker daemon.
services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:
